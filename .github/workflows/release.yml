name: Python release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified distributions to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require a matching version tag for publication
        if: inputs.publish
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          expected = f'refs/tags/v{version}'
          if os.environ['GITHUB_REF'] != expected:
              raise SystemExit(f'Publication requires tag {expected}')
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  package-install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Install built wheel with uv and check MCP
        run: python tests/package_install_smoke.py dist

  publish:
    if: inputs.publish
    needs: [build, package-install]
    runs-on: ubuntu-24.04
    environment: pypi-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
