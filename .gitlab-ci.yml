image: python:3.12-slim

stages:
  - test

test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e .
  script:
    - python -m compileall -q agent_bridge
    - python -m unittest discover -s tests -v
  cache:
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
