[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-antigravity-a2a-bridge"
version = "0.3.0"
description = "Local A2A bridge for Codex, Antigravity, OpenCode and Claude Code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aleksandr Kovalenko" }]
keywords = ["a2a", "mcp", "codex", "antigravity", "opencode", "claude-code", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "a2a-sdk>=1.1,<2",
  "mcp>=1.30,<2",
  "openai-codex>=0.154,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["coverage>=7.6,<9"]

[project.urls]
Homepage = "https://gitlab.com/kkaastr/codex-antigravity-a2a-bridge"
Repository = "https://gitlab.com/kkaastr/codex-antigravity-a2a-bridge.git"
Issues = "https://gitlab.com/kkaastr/codex-antigravity-a2a-bridge/-/issues"

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
agent-bridge-mcp = "agent_bridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_bridge*"]
